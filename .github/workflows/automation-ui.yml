name: Daily chains browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build fixture server
        run: go build -o dist/ui-server ./cmd/server
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/gs-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/gs-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise configuration page
        env:
          NODE_PATH: ${{ runner.temp }}/gs-browser/node_modules
        run: node scripts/test-automation-ui.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Daily-chain-UI-screenshots
          path: dist/ui/*.png
